# Talk & Shine — déploiement Netlify
[build]
  publish = "."
  functions = "netlify/functions"
  command = ""

[functions]
  node_bundler = "esbuild"

# La fabrique de jetons est appelée par le navigateur sur /api/token
[[redirects]]
  from = "/api/token"
  to = "/.netlify/functions/gemini-token"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Le micro n'est autorisé que pour notre propre origine.
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"

[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
