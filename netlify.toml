# Talk & Shine — déploiement Netlify
[build]
  publish = "."
  functions = "netlify/functions"
  command = ""

[functions]
  node_bundler = "esbuild"

# Le chemin /api/token est déclaré dans la fonction elle-même (export const config).

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Le micro n'est autorisé que pour notre propre origine ; caméra et
    # géolocalisation sont refusées à tout le monde.
    Permissions-Policy = "microphone=(self), camera=(), geolocation=(), payment=(), usb=()"
    # Politique de sécurité du contenu : liste blanche stricte.
    # - script-src : nos fichiers, le SDK Gemini, et les connexions Google/Apple
    # - connect-src : Gemini Live en WebSocket, rien d'autre
    # - worker-src blob: : requis par l'AudioWorklet qui capture le micro
    # - frame-ancestors none : le site ne peut pas être encadré ailleurs
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://accounts.google.com https://appleid.cdn-apple.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://secure.gravatar.com; media-src 'self' data: blob:; connect-src 'self' https://generativelanguage.googleapis.com wss://generativelanguage.googleapis.com https://cdn.jsdelivr.net https://accounts.google.com https://appleid.apple.com; worker-src 'self' blob:; child-src 'self' blob:; frame-src https://accounts.google.com https://appleid.apple.com; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'"

[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/token"
  [headers.values]
    Cache-Control = "no-store"
